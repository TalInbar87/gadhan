<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מעקב בדיקות צלם ואופטיקה</title>
  <script src="config.js"></script>
  <script src="auth-client.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      min-height: 100vh;
      direction: rtl;
    }

    /* ── Header ── */
    header {
      background: #2d2d2d;
      border-bottom: 2px solid #ff6600;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky; top: 0; z-index: 100;
    }
    .back-btn {
      background: none; border: 1px solid #555; color: #ccc;
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    .back-btn:hover { border-color: #ff6600; color: #ff6600; }
    header h1 { font-size: 20px; color: #ff6600; flex: 1; }

    /* ── Spinner ── */
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #333; border-top-color: #ff6600;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingScreen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 60vh; gap: 14px; color: #888;
    }

    /* ── Main ── */
    #mainContent { display: none; padding: 16px 20px; max-width: 900px; margin: 0 auto; }

    /* ── Unit selector ── */
    .unit-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .unit-bar label { color: #aaa; font-size: 14px; white-space: nowrap; }
    .unit-bar select {
      background: #2d2d2d; border: 1px solid #444; color: #e0e0e0;
      padding: 9px 14px; border-radius: 6px; font-size: 15px;
      min-width: 180px; flex: 1; max-width: 280px;
    }
    .unit-bar select:focus { outline: none; border-color: #ff6600; }

    /* ── Stats ── */
    .stats-row {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px;
    }
    .stat-card {
      background: #2d2d2d; border-radius: 8px;
      padding: 10px 16px; text-align: center; flex: 1; min-width: 90px;
    }
    .stat-card .num { font-size: 22px; font-weight: bold; color: #e0e0e0; }
    .stat-card .lbl { font-size: 11px; color: #888; margin-top: 2px; }
    .stat-card.red-card .num  { color: #ef4444; }
    .stat-card.green-card .num{ color: #22c55e; }

    /* ── Soldier list ── */
    #soldierList { display: flex; flex-direction: column; gap: 6px; }

    .team-label {
      background: #252525; color: #ff6600;
      font-weight: 700; font-size: 13px;
      padding: 6px 14px; border-radius: 6px;
      margin-top: 8px;
    }

    .soldier-card {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }
    .soldier-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; cursor: pointer;
      transition: background 0.15s;
    }
    .soldier-header:hover { background: #333; }
    .soldier-name { flex: 1; font-size: 15px; font-weight: 600; }
    .status-icons { display: flex; gap: 6px; }
    .status-pill {
      font-size: 11px; padding: 3px 8px; border-radius: 12px;
      white-space: nowrap; font-weight: 600;
    }
    .pill-ok     { background: #14532d; color: #4ade80; border: 1px solid #22c55e; }
    .pill-bad    { background: #450a0a; color: #fca5a5; border: 1px solid #ef4444; }
    .pill-none   { background: #1c1c1c; color: #666;    border: 1px solid #444; }
    .expand-arrow { color: #666; font-size: 12px; transition: transform 0.2s; }
    .soldier-card.open .expand-arrow { transform: rotate(180deg); }

    /* ── Items panel ── */
    .items-panel { display: none; border-top: 1px solid #333; }
    .soldier-card.open .items-panel { display: block; }

    .items-loading {
      padding: 18px; text-align: center; color: #666;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .items-loading .spinner { width: 22px; height: 22px; border-width: 2px; }

    /* ── Items table ── */
    .items-table-wrap { overflow-x: auto; }
    table.items-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.items-tbl th {
      background: #1e1e1e; color: #ff6600; font-weight: 600;
      padding: 9px 12px; text-align: right; white-space: nowrap;
      border-bottom: 2px solid #333;
    }
    table.items-tbl td {
      padding: 9px 12px; border-bottom: 1px solid #252525;
      vertical-align: middle;
    }
    table.items-tbl tr:last-child td { border-bottom: none; }
    table.items-tbl tr.item-done td { opacity: 0.35; text-decoration: line-through; }

    /* date cells */
    .dc-ok     { color: #4ade80; }
    .dc-bad    { color: #ef4444; }
    .dc-never  { color: #555; font-style: italic; }
    .dc-dot    { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 5px; vertical-align: middle; }
    .dc-dot.green { background: #22c55e; }
    .dc-dot.red   { background: #ef4444; }
    .dc-dot.gray  { background: #444; }

    /* action buttons */
    .item-btns { display: flex; gap: 5px; flex-wrap: wrap; }
    .ib {
      background: #1e1e1e; border: 1px solid #444; color: #ccc;
      padding: 5px 9px; border-radius: 5px; cursor: pointer;
      font-size: 12px; white-space: nowrap; transition: all 0.15s;
    }
    .ib:disabled { opacity: 0.35; cursor: not-allowed; }
    .ib-optics { border-color: #3b82f6; color: #93c5fd; }
    .ib-optics:hover:not(:disabled) { background: #1e3a5f; color: #60a5fa; }
    .ib-weapon { border-color: #22c55e; color: #86efac; }
    .ib-weapon:hover:not(:disabled) { background: #14532d; color: #4ade80; }
    .ib-skip   { border-color: #555; color: #666; }
    .ib-skip:hover:not(:disabled)   { background: #333; color: #999; }

    /* ── Empty / error ── */
    .empty-msg {
      padding: 30px; text-align: center; color: #555; font-size: 14px;
    }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #2d2d2d; color: #e0e0e0; padding: 10px 22px;
      border-radius: 8px; font-size: 14px; display: none; z-index: 999;
      border: 1px solid #555; pointer-events: none;
    }
    #toast.success { border-color: #22c55e; color: #4ade80; }
    #toast.error   { border-color: #ef4444; color: #fca5a5; }

    /* ── Page overlay ── */
    #pageOverlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 500;
      align-items: center; justify-content: center;
    }
    #pageOverlay.active { display: flex; }
    #pageOverlay .ov-sp {
      width: 50px; height: 50px;
      border: 4px solid #333; border-top-color: #ff6600;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header h1 { font-size: 15px; }
      #mainContent { padding: 10px 10px; }
      .unit-bar select { max-width: 100%; }
      .stats-row { gap: 6px; }
      .stat-card { padding: 8px 8px; min-width: 70px; }
      .stat-card .num { font-size: 18px; }
      .stat-card .lbl { font-size: 10px; }
      .soldier-name { font-size: 14px; }
      table.items-tbl th, table.items-tbl td { padding: 7px 8px; font-size: 12px; }
      .item-btns { flex-direction: column; }
      .ib { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

<header>
  <button class="back-btn" onclick="window.location.href='index-secure.html'">← חזרה</button>
  <h1>🔭 מעקב בדיקות צלם ואופטיקה</h1>
</header>

<div id="loadingScreen">
  <div class="spinner"></div>
  <span>טוען מסגרות...</span>
</div>

<div id="mainContent">
  <div class="unit-bar">
    <label>בחר מסגרת:</label>
    <select id="unitSelect" onchange="onUnitChange()">
      <option value="">-- בחר מסגרת --</option>
    </select>
  </div>

  <div id="statsRow" class="stats-row" style="display:none"></div>

  <div id="soldierList"></div>
</div>

<div id="toast"></div>
<div id="pageOverlay"><div class="ov-sp"></div></div>

<script>
const authClient = new SecureAuthClient(API_URL);
const authGuard  = new AuthGuard(authClient);
const OVERDUE_MS = 14 * 86400000;

// soldiers loaded for current unit
let soldiers = [];
// open soldier pn
let openPn   = null;

// ── API ────────────────────────────────────────────
async function apiPost(action, payload) {
  const p = new URLSearchParams();
  p.append('data', JSON.stringify({ action, token: authClient.token, ...payload }));
  const res = await fetch(API_URL, { method: 'POST', body: p });
  return res.json();
}

// ── Helpers ────────────────────────────────────────
function isOverdue(iso) {
  if (!iso) return true;
  return Date.now() - new Date(iso).getTime() > OVERDUE_MS;
}
function fmt(iso) {
  if (!iso) return '—';
  const d  = new Date(iso);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}
function dateCellHtml(iso) {
  if (!iso) return `<span class="dc-never"><span class="dc-dot gray"></span>לא בוצע</span>`;
  const over = isOverdue(iso);
  return `<span class="${over?'dc-bad':'dc-ok'}"><span class="dc-dot ${over?'red':'green'}"></span>${fmt(iso)}</span>`;
}
function statusPill(iso, label) {
  if (!iso)         return `<span class="status-pill pill-none">${label}: —</span>`;
  if (isOverdue(iso)) return `<span class="status-pill pill-bad">${label}: פג</span>`;
  return `<span class="status-pill pill-ok">${label}: ✓</span>`;
}

// ── Toast ───────────────────────────────────────────
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = type || '';
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

// ── Page disable ────────────────────────────────────
function setOverlay(on) {
  document.getElementById('pageOverlay').classList.toggle('active', on);
}

// ── Load units ──────────────────────────────────────
async function loadUnits() {
  const json = await apiPost('inspections_get_units', {});
  if (json.statusCode !== 200) throw new Error(json.message || 'שגיאה בטעינת מסגרות');
  const sel = document.getElementById('unitSelect');
  (json.data || []).forEach(u => {
    const opt = document.createElement('option');
    opt.value = u; opt.textContent = u;
    sel.appendChild(opt);
  });
}

// ── Unit changed ────────────────────────────────────
async function onUnitChange() {
  const unit = document.getElementById('unitSelect').value;
  document.getElementById('statsRow').style.display = 'none';
  document.getElementById('soldierList').innerHTML  = '';
  soldiers = [];
  openPn   = null;
  if (!unit) return;

  document.getElementById('soldierList').innerHTML =
    `<div class="items-loading"><div class="spinner"></div>טוען חיילים...</div>`;

  try {
    const json = await apiPost('inspections_get_soldiers', { unit });
    if (json.statusCode !== 200) throw new Error(json.message);
    soldiers = json.data || [];
    renderSoldiers(soldiers);
  } catch (e) {
    document.getElementById('soldierList').innerHTML =
      `<div class="empty-msg">❌ שגיאה: ${e.message}</div>`;
  }
}

// ── Render soldiers ─────────────────────────────────
function renderSoldiers(list) {
  buildStats(list);

  const container = document.getElementById('soldierList');
  if (!list.length) {
    container.innerHTML = `<div class="empty-msg">לא נמצאו חיילים במסגרת זו</div>`;
    return;
  }

  // Group by team
  const byTeam = {};
  const order  = [];
  list.forEach(s => {
    const t = s.team || 'ללא צוות';
    if (!byTeam[t]) { byTeam[t] = []; order.push(t); }
    byTeam[t].push(s);
  });

  let html = '';
  order.forEach(team => {
    html += `<div class="team-label">👥 ${team}</div>`;
    byTeam[team].forEach(s => {
      html += `
      <div class="soldier-card" id="sc-${s.pn}">
        <div class="soldier-header" onclick="toggleSoldier('${s.pn}','${escAttr(s.name)}','${escAttr(s.unit)}')">
          <span class="soldier-name">${s.name}</span>
          <div class="status-icons">
            ${statusPill(s.lastOptics, '🔭')}
            ${statusPill(s.lastWeapon, '🔫')}
          </div>
          <span class="expand-arrow">▼</span>
        </div>
        <div class="items-panel" id="ip-${s.pn}">
          <div class="items-loading" id="il-${s.pn}">
            <div class="spinner"></div>טוען פריטים...
          </div>
        </div>
      </div>`;
    });
  });

  container.innerHTML = html;
}

function escAttr(s) { return (s||'').replace(/'/g,"\\'"); }

// ── Stats ───────────────────────────────────────────
function buildStats(list) {
  const total = list.length;
  const badO  = list.filter(s => isOverdue(s.lastOptics)).length;
  const badW  = list.filter(s => isOverdue(s.lastWeapon)).length;
  const row   = document.getElementById('statsRow');
  row.style.display = 'flex';
  row.innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">חיילים</div></div>
    <div class="stat-card red-card"><div class="num">${badO}</div><div class="lbl">אופטיקה לא תקינה</div></div>
    <div class="stat-card green-card"><div class="num">${total-badO}</div><div class="lbl">אופטיקה תקינה</div></div>
    <div class="stat-card red-card"><div class="num">${badW}</div><div class="lbl">נשק לא תקין</div></div>
    <div class="stat-card green-card"><div class="num">${total-badW}</div><div class="lbl">נשק תקין</div></div>
  `;
}

// ── Toggle soldier ───────────────────────────────────
async function toggleSoldier(pn, name, unit) {
  const card  = document.getElementById('sc-' + pn);
  const panel = document.getElementById('ip-' + pn);
  const isOpen = card.classList.contains('open');

  // Close any open card
  if (openPn && openPn !== pn) {
    const prevCard = document.getElementById('sc-' + openPn);
    if (prevCard) prevCard.classList.remove('open');
  }

  if (isOpen) {
    card.classList.remove('open');
    openPn = null;
    return;
  }

  card.classList.add('open');
  openPn = pn;

  // Load if not already loaded
  if (panel.dataset.loaded) return;
  panel.dataset.loaded = '1';

  try {
    const json = await apiPost('inspections_get_soldier_data', { pn });
    if (json.statusCode !== 200) throw new Error(json.message);
    renderItemsPanel(panel, pn, name, unit, json.data);
  } catch (e) {
    panel.innerHTML = `<div class="empty-msg">❌ ${e.message}</div>`;
  }
}

// ── Render items panel ───────────────────────────────
function renderItemsPanel(panel, pn, name, unit, data) {
  const { items, history } = data;
  if (!items || !items.length) {
    panel.innerHTML = `<div class="empty-msg">לא נמצאו פריטים לחייל זה</div>`;
    return;
  }

  let rows = '';
  items.forEach(item => {
    const h   = history[item.key] || {};
    const lo  = h.lastOptics || null;
    const lw  = h.lastWeapon || null;
    rows += `
      <tr id="ir-${pn}-${item.key}">
        <td>${item.label}</td>
        <td style="color:#888;font-size:12px">${item.value}</td>
        <td>${dateCellHtml(lo)}</td>
        <td>${dateCellHtml(lw)}</td>
        <td>
          <div class="item-btns">
            <button class="ib ib-optics"
              onclick="markCheck('${pn}','${escAttr(name)}','${escAttr(unit)}','${item.key}','optics',this)">
              🔭 אופטיקה
            </button>
            <button class="ib ib-weapon"
              onclick="markCheck('${pn}','${escAttr(name)}','${escAttr(unit)}','${item.key}','weapon',this)">
              🔫 נשק
            </button>
            <button class="ib ib-skip"
              onclick="skipItem('${pn}','${item.key}',this)">
              — לא נדרש
            </button>
          </div>
        </td>
      </tr>`;
  });

  panel.innerHTML = `
    <div class="items-table-wrap">
      <table class="items-tbl">
        <thead>
          <tr>
            <th>פריט</th>
            <th>ערך/סידורי</th>
            <th>בדיקת אופטיקה</th>
            <th>בדיקת נשק</th>
            <th>פעולות</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ── Mark check ───────────────────────────────────────
async function markCheck(pn, name, unit, itemKey, type, btn) {
  setOverlay(true);
  try {
    const json = await apiPost('inspections_mark', { pn, name, unit, itemKey, type });
    if (json.statusCode === 200) {
      const now    = new Date().toISOString();
      const row    = document.getElementById(`ir-${pn}-${itemKey}`);
      const label  = type === 'optics' ? 'אופטיקה' : 'נשק';
      const colIdx = type === 'optics' ? 2 : 3;   // td index (0=פריט,1=ערך,2=אופטיקה,3=נשק)
      if (row) {
        row.cells[colIdx].innerHTML = dateCellHtml(now);
      }
      // Update local soldier status
      const s = soldiers.find(s => s.pn.toString() === pn.toString());
      if (s) {
        if (type === 'optics') s.lastOptics = now;
        else                   s.lastWeapon = now;
        s.overdueOptics = isOverdue(s.lastOptics);
        s.overdueWeapon = isOverdue(s.lastWeapon);
        // Refresh status pills
        const header = document.querySelector(`#sc-${pn} .status-icons`);
        if (header) header.innerHTML = statusPill(s.lastOptics,'🔭') + statusPill(s.lastWeapon,'🔫');
        buildStats(soldiers);
      }
      showToast(`✅ בדיקת ${label} עודכנה`, 'success');
    } else {
      showToast('❌ ' + (json.message || 'שגיאה'), 'error');
    }
  } catch (e) {
    showToast('❌ שגיאת רשת', 'error');
  } finally {
    setOverlay(false);
  }
}

// ── Skip item (client-only) ──────────────────────────
function skipItem(pn, itemKey, btn) {
  const row = document.getElementById(`ir-${pn}-${itemKey}`);
  if (row) {
    row.classList.add('item-done');
    row.querySelectorAll('.ib').forEach(b => b.disabled = true);
  }
}

// ── Init ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  const ok = await authGuard.checkAuth();
  if (!ok) return;
  try {
    await loadUnits();
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('mainContent').style.display   = 'block';
  } catch (e) {
    document.getElementById('loadingScreen').innerHTML =
      `<div style="color:#ef4444">❌ ${e.message}</div>`;
  }
});
</script>
</body>
</html>
