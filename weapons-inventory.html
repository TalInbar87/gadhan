<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סיכום מלאי נשקים - גדחה"ו קומנדו 8219</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* ── Header ── */
        header {
            background: linear-gradient(135deg, #ff6600 0%, #ff8c00 100%);
            padding: 25px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255,102,0,0.3);
            margin-bottom: 30px;
            position: relative;
        }

        header h1 { color: #000; font-size: 2em; font-weight: bold; margin-bottom: 5px; }
        header .subtitle { color: #1a1a1a; font-size: 1em; font-weight: 600; }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.25);
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(0,0,0,0.35); }

        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
            padding: 10px 16px;
            background: #2d2d2d;
            border: 2px solid #ff6600;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box::placeholder { color: #888; }
        .search-box:focus { border-color: #ff8c00; }

        .summary-badge {
            background: rgba(255,102,0,0.15);
            border: 2px solid #ff6600;
            color: #ff6600;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: 600;
            white-space: nowrap;
        }

        .btn-refresh {
            background: #ff6600;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 700;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .btn-refresh:hover { background: #ff8c00; transform: scale(1.03); }
        .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ── Table wrapper ── */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 600px;
            font-size: 0.88em;
        }

        /* sticky first column */
        th:first-child,
        td:first-child {
            position: sticky;
            right: 0;
            z-index: 2;
            min-width: 160px;
            max-width: 200px;
        }

        thead th {
            background: #ff6600;
            color: #000;
            font-weight: 700;
            padding: 12px 14px;
            text-align: center;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 3;
        }

        /* corner cell: sticky top + sticky right */
        thead th:first-child { z-index: 4; background: #e55a00; }

        /* total column */
        th.col-total { background: #cc5200 !important; }
        td.col-total {
            background: rgba(255,102,0,0.18) !important;
            font-weight: 700;
            color: #ff8c00;
        }

        tbody tr { transition: background 0.15s; }
        tbody tr:nth-child(even) { background: #222; }
        tbody tr:nth-child(odd)  { background: #2a2a2a; }
        tbody tr:hover           { background: #333; }

        td {
            padding: 9px 14px;
            text-align: center;
            border-bottom: 1px solid #3a3a3a;
            color: #ddd;
        }

        td:first-child {
            text-align: right;
            font-weight: 600;
            color: #fff;
            background: inherit;
        }
        tbody tr:nth-child(even) td:first-child { background: #222; }
        tbody tr:nth-child(odd)  td:first-child  { background: #2a2a2a; }
        tbody tr:hover td:first-child            { background: #333; }

        .count-zero { color: #444; }
        .count-pos  { color: #ff8c00; font-weight: 700; }

        /* loading / error states */
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(255,102,0,0.3);
            border-top-color: #ff6600;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: rgba(255,60,60,0.15);
            border: 2px solid #f44;
            color: #f88;
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .no-results {
            text-align: center;
            color: #888;
            padding: 30px;
            font-size: 1em;
        }

        footer {
            text-align: center;
            color: #888;
            margin-top: 40px;
            padding: 20px;
            border-top: 2px solid #ff6600;
            font-size: 0.85em;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.4em; }
            .back-btn { position: static; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="container" id="mainContent" style="display:none;">
        <header>
            <a href="index-secure.html" class="back-btn">← חזרה</a>
            <h1>📦 סיכום מלאי נשקים</h1>
            <div class="subtitle">כמות חיילים המחזיקים כל פריט, לפי מסגרת</div>
        </header>

        <div id="errorMsg" class="error-msg"></div>

        <div class="toolbar">
            <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="🔍 חיפוש פריט..."
                oninput="filterTable()"
            />
            <div class="summary-badge" id="summaryBadge">טוען...</div>
            <button class="btn-refresh" id="refreshBtn" onclick="loadInventory()">↻ רענן</button>
        </div>

        <div class="table-wrapper">
            <table id="inventoryTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <footer>
            <p>גדחה"ו קומנדו 8219 | סיכום מלאי נשקים</p>
            <p style="margin-top:8px;">🔒 כל התקשורת מוצפנת | 📝 כל הפעולות מתועדות</p>
        </footer>
    </div>

    <script src="config.js"></script>
    <script src="auth-client.js"></script>

    <script>
        // ============================================================
        // Init
        // ============================================================
        const authClient = new SecureAuthClient(API_URL);
        const authGuard  = new AuthGuard(authClient);

        let inventoryData = null; // { units, items, counts, totals }

        window.addEventListener('DOMContentLoaded', async () => {
            const ok = await authGuard.checkAuth();
            if (ok) {
                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display   = 'block';
                await loadInventory();
            }
        });

        // ============================================================
        // Fetch Inventory from Backend
        // ============================================================
        async function loadInventory() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '...טוען';
            showError('');

            try {
                const token = authClient.token;
                const res   = await fetch(API_URL, {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ action: 'get_weapons_inventory', token })
                });

                const json = await res.json();
                if (!json.success) throw new Error(json.message || 'שגיאה בטעינת הנתונים');

                inventoryData = json.data;
                renderTable(inventoryData);
                document.getElementById('summaryBadge').textContent =
                    inventoryData.units.length + ' מסגרות | ' + inventoryData.items.length + ' פריטים';

            } catch (err) {
                showError('שגיאה בטעינת הנתונים: ' + err.message);
            } finally {
                btn.disabled    = false;
                btn.textContent = '↻ רענן';
            }
        }

        // ============================================================
        // Render Table
        // ============================================================
        function renderTable(data) {
            const { units, items, counts, totals } = data;

            // ── Header ──
            const thead = document.getElementById('tableHead');
            let hRow = '<tr><th>פריט</th>';
            units.forEach(u => { hRow += `<th>${escHtml(u)}</th>`; });
            hRow += '<th class="col-total">סה"כ</th></tr>';
            thead.innerHTML = hRow;

            // ── Body ──
            buildBody(items, units, counts, totals);
        }

        function buildBody(items, units, counts, totals, filter) {
            const tbody  = document.getElementById('tableBody');
            const needle = (filter || '').trim().toLowerCase();
            let rows     = '';
            let visible  = 0;

            items.forEach(item => {
                if (needle && !item.label.toLowerCase().includes(needle) &&
                              !item.key.toLowerCase().includes(needle)) return;
                visible++;

                let row = `<td>${escHtml(item.label)}</td>`;

                if (inventoryData) {
                    inventoryData.units.forEach(u => {
                        const c = (counts[item.key] && counts[item.key][u]) || 0;
                        row += c > 0
                            ? `<td class="count-pos">${c}</td>`
                            : `<td class="count-zero">–</td>`;
                    });
                    const tot = totals[item.key] || 0;
                    row += tot > 0
                        ? `<td class="col-total count-pos">${tot}</td>`
                        : `<td class="col-total count-zero">–</td>`;
                }

                rows += `<tr>${row}</tr>`;
            });

            if (visible === 0) {
                const cols = inventoryData
                    ? inventoryData.units.length + 2
                    : 2;
                rows = `<tr><td colspan="${cols}" class="no-results">לא נמצאו פריטים תואמים</td></tr>`;
            }

            tbody.innerHTML = rows;
        }

        // ============================================================
        // Search Filter
        // ============================================================
        function filterTable() {
            if (!inventoryData) return;
            const needle = document.getElementById('searchInput').value;
            buildBody(inventoryData.items, inventoryData.units,
                      inventoryData.counts, inventoryData.totals, needle);
        }

        // ============================================================
        // Helpers
        // ============================================================
        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent  = msg;
            el.style.display = msg ? 'block' : 'none';
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
