<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סיכום מלאי נשקים - גדחה"ו קומנדו 8219</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* ── Header ── */
        header {
            background: linear-gradient(135deg, #ff6600 0%, #ff8c00 100%);
            padding: 25px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255,102,0,0.3);
            margin-bottom: 30px;
            position: relative;
        }

        header h1 { color: #000; font-size: 2em; font-weight: bold; margin-bottom: 5px; }
        header .subtitle { color: #1a1a1a; font-size: 1em; font-weight: 600; }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.25);
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(0,0,0,0.35); }

        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
            padding: 10px 16px;
            background: #2d2d2d;
            border: 2px solid #ff6600;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box::placeholder { color: #888; }
        .search-box:focus { border-color: #ff8c00; }

        .summary-badge {
            background: rgba(255,102,0,0.15);
            border: 2px solid #ff6600;
            color: #ff6600;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: 600;
            white-space: nowrap;
        }

        .btn-refresh {
            background: #ff6600;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 700;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .btn-refresh:hover { background: #ff8c00; transform: scale(1.03); }
        .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ── Table wrapper ── */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 600px;
            font-size: 0.88em;
        }

        /* sticky first column */
        th:first-child,
        td:first-child {
            position: sticky;
            right: 0;
            z-index: 2;
            min-width: 160px;
            max-width: 200px;
        }

        thead th {
            background: #ff6600;
            color: #000;
            font-weight: 700;
            padding: 12px 14px;
            text-align: center;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 3;
        }

        /* corner cell: sticky top + sticky right */
        thead th:first-child { z-index: 4; background: #e55a00; }

        /* total-issued column */
        th.col-total { background: #cc5200 !important; }
        td.col-total {
            background: rgba(255,102,0,0.18) !important;
            font-weight: 700;
            color: #ff8c00;
        }

        /* armory column */
        th.col-armory { background: #1a5fa8 !important; color: #fff !important; }
        td.col-armory {
            background: rgba(74,158,255,0.12) !important;
            font-weight: 700;
            color: #4a9eff;
        }
        td.col-armory.count-zero { color: #2a4a6a; }

        /* grand-total column */
        th.col-grand { background: #2d7a2d !important; color: #fff !important; }
        td.col-grand {
            background: rgba(60,180,60,0.12) !important;
            font-weight: 700;
            color: #5dcc5d;
        }
        td.col-grand.count-zero { color: #1e4a1e; }

        tbody tr { transition: background 0.15s; }
        tbody tr:nth-child(even) { background: #222; }
        tbody tr:nth-child(odd)  { background: #2a2a2a; }
        tbody tr:hover           { background: #333; }

        td {
            padding: 9px 14px;
            text-align: center;
            border-bottom: 1px solid #3a3a3a;
            color: #ddd;
        }

        td:first-child {
            text-align: right;
            font-weight: 600;
            color: #fff;
            background: inherit;
        }
        tbody tr:nth-child(even) td:first-child { background: #222; }
        tbody tr:nth-child(odd)  td:first-child  { background: #2a2a2a; }
        tbody tr:hover td:first-child            { background: #333; }

        .count-zero { color: #444; }
        .count-pos  { color: #ff8c00; font-weight: 700; }

        td.clickable {
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        td.clickable:hover {
            background: rgba(255,102,0,0.25) !important;
            transform: scale(1.1);
        }

        /* ── Names Popup ── */
        .popup-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            display: flex; align-items: center; justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.15s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .popup-box {
            background: #1e1e1e;
            border: 2px solid #ff6600;
            border-radius: 14px;
            padding: 24px 28px;
            min-width: 280px;
            max-width: 420px;
            max-height: 70vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            animation: slideUp 0.15s ease;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .popup-title {
            font-size: 1em;
            font-weight: 700;
            color: #ff8c00;
            margin-bottom: 4px;
        }
        .popup-unit {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .popup-names { list-style: none; }
        .popup-names li {
            padding: 7px 10px;
            border-radius: 7px;
            color: #ddd;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .popup-names li:nth-child(even) { background: #2a2a2a; }
        .popup-names li::before { content: '•'; color: #ff6600; font-weight: 700; }
        .popup-names li.in-apson { background: #7c2d00 !important; color: #fed7aa; border-right: 3px solid #f97316; }
        .popup-names li.in-apson::before { color: #f97316; }
        .popup-item-value { margin-right: auto; font-size: 0.82em; color: #999; font-family: monospace; }
        .popup-names li.in-apson .popup-item-value { color: #fb923c; }

        .popup-close {
            margin-top: 18px;
            width: 100%;
            background: #ff6600;
            color: #000;
            border: none;
            padding: 9px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95em;
            transition: background 0.2s;
        }
        .popup-close:hover { background: #ff8c00; }

        /* loading / error states */
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(255,102,0,0.3);
            border-top-color: #ff6600;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: rgba(255,60,60,0.15);
            border: 2px solid #f44;
            color: #f88;
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .no-results {
            text-align: center;
            color: #888;
            padding: 30px;
            font-size: 1em;
        }

        /* ── Multi-select filter combobox ── */
        .ms-wrap { flex: 1; min-width: 220px; position: relative; }

        .ms-input {
            width: 100%;
            padding: 10px 16px;
            background: #2d2d2d;
            border: 2px solid #ff6600;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            outline: none;
            cursor: pointer;
        }
        .ms-input:focus { border-color: #ff8c00; }

        .ms-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0; left: 0;
            background: #1e1e1e;
            border: 2px solid #ff6600;
            border-radius: 12px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            overflow: hidden;
        }
        .ms-dropdown.open { display: block; }

        .ms-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid #333;
            background: #161616;
        }
        .ms-select-all {
            display: flex; align-items: center; gap: 7px;
            cursor: pointer; color: #ff8c00; font-weight: 700;
            font-size: 0.88em; white-space: nowrap; user-select: none;
        }
        .ms-select-all input { accent-color: #ff6600; width: 15px; height: 15px; cursor: pointer; }
        .ms-count { color: #555; font-size: 0.78em; margin-right: auto; }

        .ms-list {
            max-height: 260px;
            overflow-y: auto;
            padding: 6px 0;
        }
        .ms-item {
            display: flex; align-items: center; gap: 9px;
            padding: 7px 14px;
            cursor: pointer;
            font-size: 0.88em;
            color: #ccc;
            user-select: none;
        }
        .ms-item:hover { background: rgba(255,102,0,0.15); color: #fff; }
        .ms-item input[type=checkbox] { accent-color: #ff6600; width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
        .ms-item.ms-hidden { display: none; }

        /* ── CSV button ── */
        .btn-csv {
            background: #1e4d1e;
            color: #5dcc5d;
            border: 1px solid #2d7a2d;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 700;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .btn-csv:hover { background: #2d7a2d; }

        footer {
            text-align: center;
            color: #888;
            margin-top: 40px;
            padding: 20px;
            border-top: 2px solid #ff6600;
            font-size: 0.85em;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.4em; }
            .back-btn { position: static; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="container" id="mainContent" style="display:none;">
        <header>
            <a href="index-secure.html" class="back-btn">← חזרה</a>
            <h1>📦 סיכום מלאי נשקים</h1>
            <div class="subtitle">כמות חיילים המחזיקים כל פריט, לפי מסגרת</div>
        </header>

        <div id="errorMsg" class="error-msg"></div>

        <div class="toolbar">
            <div class="ms-wrap">
                <input type="text" id="msInput" class="ms-input"
                       placeholder="🔍 סינון פריטים..."
                       oninput="filterMsList()"
                       onfocus="openMsDrop()"
                       autocomplete="off" />
                <div id="msDrop" class="ms-dropdown">
                    <div class="ms-header">
                        <label class="ms-select-all">
                            <input type="checkbox" id="selectAllCb" checked onchange="toggleAll(this.checked)" />
                            סמן הכל
                        </label>
                        <span class="ms-count" id="filterCount"></span>
                    </div>
                    <div class="ms-list" id="msList"></div>
                </div>
            </div>
            <div class="summary-badge" id="summaryBadge">טוען...</div>
            <button class="btn-csv" onclick="exportCsv()">⬇ ייצא CSV</button>
            <button class="btn-refresh" id="refreshBtn" onclick="loadInventory()">↻ רענן</button>
        </div>

        <!-- חיפוש לפי מספר מוצר -->
        <div class="toolbar" style="margin-bottom:10px;">
            <input
                type="text"
                id="serialSearchInput"
                class="search-box"
                placeholder="🔎 חיפוש לפי מספר מוצר..."
                oninput="searchBySerial()"
                style="border-color:#4a9eff;"
            />
        </div>
        <div id="serialSearchResult" style="display:none; margin-bottom:20px; background:#1e2a3a; border:2px solid #4a9eff; border-radius:12px; padding:16px;"></div>

        <div class="table-wrapper">
            <table id="inventoryTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <footer>
            <p>גדחה"ו קומנדו 8219 | סיכום מלאי נשקים</p>
            <p style="margin-top:8px;">🔒 כל התקשורת מוצפנת | 📝 כל הפעולות מתועדות</p>
        </footer>
    </div>

    <!-- Names Popup -->
    <div id="namesPopup" class="popup-overlay" style="display:none;" onclick="closePopupOnOverlay(event)">
        <div class="popup-box">
            <div class="popup-title" id="popupTitle"></div>
            <div class="popup-unit" id="popupUnit"></div>
            <ul class="popup-names" id="popupNames"></ul>
            <button class="popup-close" onclick="closePopup()">סגור</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth-client.js"></script>

    <script>
        // ============================================================
        // Init
        // ============================================================
        const authClient = new SecureAuthClient(API_URL);
        const authGuard  = new AuthGuard(authClient);

        let inventoryData = null; // { units, items, counts, totals, names }
        let armoryData   = null; // { counts: { itemKey: number } }
        let checkedKeys  = new Set(); // פריטים מסומנים (ברירת מחדל: הכל)

        window.addEventListener('DOMContentLoaded', async () => {
            const ok = await authGuard.checkAuth();
            if (ok) {
                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display   = 'block';
                await loadInventory();
            }
        });

        // ============================================================
        // Fetch Inventory from Backend
        // ============================================================
        async function loadInventory() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '...טוען';
            showError('');

            try {
                const makePost = (action) => {
                    const p = new URLSearchParams();
                    p.append('data', JSON.stringify({ action, token: authClient.token }));
                    return fetch(API_URL, { method: 'POST', body: p });
                };

                const [invRes, armRes] = await Promise.all([
                    makePost('get_weapons_inventory'),
                    makePost('get_armory_count')
                ]);

                const [invJson, armJson] = await Promise.all([invRes.json(), armRes.json()]);
                if (invJson.statusCode !== 200) throw new Error(invJson.message || 'שגיאה בטעינת הנתונים');

                inventoryData = invJson.data;
                armoryData    = armJson.statusCode === 200 ? armJson.data : null;

                renderTable(inventoryData, armoryData);
                document.getElementById('summaryBadge').textContent =
                    inventoryData.units.length + ' מסגרות | ' + inventoryData.items.length + ' פריטים';
                renderChecklist();

            } catch (err) {
                showError('שגיאה בטעינת הנתונים: ' + err.message);
            } finally {
                btn.disabled    = false;
                btn.textContent = '↻ רענן';
            }
        }

        // ============================================================
        // Render Table
        // ============================================================
        function renderTable(data, armory) {
            const { units, items, counts, totals } = data;

            // ── Header ──
            const thead = document.getElementById('tableHead');
            let hRow = '<tr><th>פריט</th>';
            units.forEach(u => { hRow += `<th>${escHtml(u)}</th>`; });
            hRow += '<th class="col-total">סה"כ נופק</th>';
            hRow += '<th class="col-armory">נשקייה</th>';
            hRow += '<th class="col-grand">סה"כ</th>';
            hRow += '</tr>';
            thead.innerHTML = hRow;

            // ── Body ──
            buildBody(items, units, counts, totals, data.names || {}, armory);
        }

        function buildBody(items, units, counts, totals, names, armory) {
            const tbody  = document.getElementById('tableBody');
            let rows     = '';
            let visible  = 0;

            items.forEach(item => {
                visible++;

                let row = `<td>${escHtml(item.label)}</td>`;

                units.forEach(u => {
                    const c = (counts[item.key] && counts[item.key][u]) || 0;
                    if (c > 0) {
                        const label = escHtml(item.label).replace(/'/g, "\\'");
                        const unit  = escHtml(u).replace(/'/g, "\\'");
                        row += `<td class="count-pos clickable" onclick="showNamesPopup('${item.key}','${unit}','${label}')">${c}</td>`;
                    } else {
                        row += `<td class="count-zero">–</td>`;
                    }
                });

                const tot = totals[item.key] || 0;
                row += tot > 0
                    ? `<td class="col-total count-pos">${tot}</td>`
                    : `<td class="col-total count-zero">–</td>`;

                const arm = armory ? (armory.counts[item.key] || 0) : null;
                if (arm === null) {
                    row += `<td class="col-armory count-zero">–</td>`;
                    row += `<td class="col-grand count-zero">–</td>`;
                } else {
                    row += arm > 0
                        ? `<td class="col-armory count-pos">${arm}</td>`
                        : `<td class="col-armory count-zero">–</td>`;
                    const grand = tot + arm;
                    row += grand > 0
                        ? `<td class="col-grand count-pos">${grand}</td>`
                        : `<td class="col-grand count-zero">–</td>`;
                }

                rows += `<tr>${row}</tr>`;
            });

            if (visible === 0) {
                const cols = (inventoryData ? inventoryData.units.length : 0) + 4;
                rows = `<tr><td colspan="${cols}" class="no-results">לא נמצאו פריטים תואמים</td></tr>`;
            }

            tbody.innerHTML = rows;
        }

        // ============================================================
        // Multi-select filter combobox
        // ============================================================
        function renderChecklist() {
            if (!inventoryData) return;
            checkedKeys = new Set(inventoryData.items.map(i => i.key));
            document.getElementById('msList').innerHTML = inventoryData.items.map(item => `
                <label class="ms-item" data-key="${escHtml(item.key)}" data-label="${item.label.toLowerCase()}">
                    <input type="checkbox" checked />
                    ${escHtml(item.label)}
                </label>
            `).join('');
            updateSelectAll();
            updateFilterCount();
            applyFilter();
        }

        // listener יחיד על הרשימה — מונע בעיות inline-JS עם גרשיים במפתחות
        document.getElementById('msList').addEventListener('change', e => {
            if (e.target.type !== 'checkbox') return;
            const key = e.target.closest('.ms-item').dataset.key;
            if (e.target.checked) checkedKeys.add(key);
            else                  checkedKeys.delete(key);
            updateSelectAll();
            updateFilterCount();
            applyFilter();
        });

        function openMsDrop() {
            document.getElementById('msDrop').classList.add('open');
        }

        function closeMsDrop() {
            document.getElementById('msDrop').classList.remove('open');
            document.getElementById('msInput').value = '';
            // הצג כל הפריטים ברשימה מחדש
            document.querySelectorAll('#msList .ms-item').forEach(el => el.classList.remove('ms-hidden'));
        }

        function filterMsList() {
            const q = document.getElementById('msInput').value.trim().toLowerCase();
            document.querySelectorAll('#msList .ms-item').forEach(el => {
                el.classList.toggle('ms-hidden', !!q && !el.dataset.label.includes(q));
            });
        }

        function toggleAll(checked) {
            if (!inventoryData) return;
            if (checked) checkedKeys = new Set(inventoryData.items.map(i => i.key));
            else         checkedKeys = new Set();
            document.querySelectorAll('#msList input[type=checkbox]').forEach(cb => cb.checked = checked);
            updateFilterCount();
            applyFilter();
        }

        function updateSelectAll() {
            const total = inventoryData ? inventoryData.items.length : 0;
            const cb    = document.getElementById('selectAllCb');
            cb.checked       = checkedKeys.size === total;
            cb.indeterminate = checkedKeys.size > 0 && checkedKeys.size < total;
        }

        function updateFilterCount() {
            const total = inventoryData ? inventoryData.items.length : 0;
            document.getElementById('filterCount').textContent =
                checkedKeys.size === total ? `${total} פריטים` : `${checkedKeys.size} / ${total}`;
        }

        function applyFilter() {
            if (!inventoryData) return;
            const filtered = inventoryData.items.filter(i => checkedKeys.has(i.key));
            buildBody(filtered, inventoryData.units, inventoryData.counts,
                      inventoryData.totals, inventoryData.names || {}, armoryData);
        }

        // סגור dropdown בלחיצה מחוץ
        document.addEventListener('click', e => {
            const wrap = document.querySelector('.ms-wrap');
            if (wrap && !wrap.contains(e.target)) closeMsDrop();
        });

        // ============================================================
        // CSV Export
        // ============================================================
        function exportCsv() {
            if (!inventoryData) return;
            const { units, items, counts, totals } = inventoryData;

            const filtered = items.filter(i => checkedKeys.has(i.key));

            const headers = ['פריט', ...units, 'סה"כ נופק', 'נשקייה', 'סה"כ'];
            const rows = filtered.map(item => {
                const unitCounts = units.map(u => (counts[item.key] && counts[item.key][u]) || 0);
                const tot   = totals[item.key] || 0;
                const arm   = armoryData ? (armoryData.counts[item.key] || 0) : '';
                const grand = armoryData ? tot + (armoryData.counts[item.key] || 0) : '';
                return [item.label, ...unitCounts, tot, arm, grand];
            });

            const csv = [headers, ...rows]
                .map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(','))
                .join('\n');

            const today = new Date().toLocaleDateString('he-IL').replace(/\//g, '-');
            const blob  = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url   = URL.createObjectURL(blob);
            const a     = document.createElement('a');
            a.href = url;
            a.download = `מלאי_נשקים_${today}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ============================================================
        // Names Popup
        // ============================================================
        function showNamesPopup(itemKey, unit, itemLabel) {
            const names = (inventoryData.names[itemKey] && inventoryData.names[itemKey][unit]) || [];
            document.getElementById('popupTitle').textContent = itemLabel;
            document.getElementById('popupUnit').textContent  = 'מסגרת: ' + unit + ' | ' + names.length + ' חיילים';
            const ul = document.getElementById('popupNames');
            ul.innerHTML = names.map(entry => {
                const n = (typeof entry === 'object') ? entry : { name: entry, value: '', inApson: false };
                const cls = n.inApson ? ' class="in-apson"' : '';
                const apsonTag = n.inApson ? ' <span style="font-size:0.75em;background:#f97316;color:#fff;border-radius:4px;padding:1px 5px;margin-right:4px;">באיפסון</span>' : '';
                const valSpan = n.value ? `<span class="popup-item-value">${escHtml(n.value)}</span>` : '';
                return `<li${cls}>${apsonTag}${escHtml(n.name)}${valSpan}</li>`;
            }).join('');
            document.getElementById('namesPopup').style.display = 'flex';
        }

        function searchBySerial() {
            const query   = document.getElementById('serialSearchInput').value.trim();
            const resultEl = document.getElementById('serialSearchResult');
            if (!query || !inventoryData) { resultEl.style.display = 'none'; return; }

            const results = [];
            inventoryData.items.forEach(item => {
                const byUnit = inventoryData.names[item.key] || {};
                Object.keys(byUnit).forEach(unit => {
                    (byUnit[unit] || []).forEach(entry => {
                        const e = (typeof entry === 'object') ? entry : { name: entry, value: '' };
                        if (e.value && String(e.value).toLowerCase().includes(query.toLowerCase())) {
                            results.push({ item, unit, entry: e });
                        }
                    });
                });
            });

            if (results.length === 0) {
                resultEl.style.display = 'block';
                resultEl.innerHTML = `<div style="color:#888;text-align:center;">לא נמצאו תוצאות עבור "${escHtml(query)}"</div>`;
                return;
            }

            resultEl.style.display = 'block';
            resultEl.innerHTML = `
                <div style="color:#4a9eff;font-weight:700;margin-bottom:12px;">נמצאו ${results.length} תוצאות:</div>
                ${results.map(r => {
                    const apsonTag = r.entry.inApson
                        ? `<span style="font-size:0.75em;background:#f97316;color:#fff;border-radius:4px;padding:1px 6px;margin-right:4px;">באיפסון</span>`
                        : '';
                    const transferUrl = `weapons-transfer.html?pn=${encodeURIComponent(r.entry.pn || '')}`;
                    return `
                        <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:#263547;border-radius:8px;margin-bottom:6px;flex-wrap:wrap;">
                            <span style="color:#ff8c00;font-weight:700;min-width:120px;">${escHtml(r.item.label)}</span>
                            <a href="${transferUrl}" style="color:#fff;font-weight:600;text-decoration:underline;cursor:pointer;">${escHtml(r.entry.name)}</a>
                            <span style="color:#aaa;font-family:monospace;font-size:0.85em;">${escHtml(r.entry.pn || '')}</span>
                            <span style="color:#4a9eff;font-family:monospace;">${escHtml(r.entry.value)}</span>
                            <span style="color:#aaa;font-size:0.85em;">${escHtml(r.unit)}</span>
                            ${apsonTag}
                        </div>`;
                }).join('')}
            `;
        }

        function closePopup() {
            document.getElementById('namesPopup').style.display = 'none';
        }

        function closePopupOnOverlay(e) {
            if (e.target === document.getElementById('namesPopup')) closePopup();
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

        // ============================================================
        // Helpers
        // ============================================================
        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent  = msg;
            el.style.display = msg ? 'block' : 'none';
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
