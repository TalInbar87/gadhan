<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ספירת מלאי נשקייה - גדחה"ו קומנדו 8219</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* ── Header ── */
        header {
            background: linear-gradient(135deg, #ff6600 0%, #ff8c00 100%);
            padding: 25px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255,102,0,0.3);
            margin-bottom: 30px;
            position: relative;
        }

        header h1 { color: #000; font-size: 2em; font-weight: bold; margin-bottom: 5px; }
        header .subtitle { color: #1a1a1a; font-size: 1em; font-weight: 600; }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.25);
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(0,0,0,0.35); }

        /* ── Last count banner ── */
        .last-count-banner {
            background: rgba(255,102,0,0.1);
            border: 1px solid rgba(255,102,0,0.3);
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 24px;
            color: #aaa;
            font-size: 0.9em;
            display: none;
        }
        .last-count-banner span { color: #ff8c00; font-weight: 600; }

        /* ── Search ── */
        .search-box {
            width: 100%;
            padding: 11px 16px;
            background: #2d2d2d;
            border: 2px solid #ff6600;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            outline: none;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }
        .search-box::placeholder { color: #666; }
        .search-box:focus { border-color: #ff8c00; }

        /* ── Items grid ── */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }

        .item-card {
            background: linear-gradient(145deg, #2d2d2d, #222);
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: border-color 0.2s;
        }
        .item-card:focus-within { border-color: #ff6600; }

        .item-label {
            font-size: 0.92em;
            color: #ddd;
            flex: 1;
        }

        .item-input {
            width: 70px;
            padding: 6px 10px;
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 7px;
            color: #fff;
            font-size: 1em;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
            -moz-appearance: textfield;
        }
        .item-input::-webkit-inner-spin-button,
        .item-input::-webkit-outer-spin-button { -webkit-appearance: none; }
        .item-input:focus { border-color: #ff6600; }
        .item-input.has-value { border-color: #ff6600; color: #ff8c00; font-weight: 700; }

        /* ── Save section ── */
        .save-section {
            background: #222;
            border: 2px solid #ff6600;
            border-radius: 12px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .save-info { color: #aaa; font-size: 0.9em; }
        .save-info strong { color: #ff8c00; }

        .btn-save {
            background: linear-gradient(135deg, #ff6600, #ff8c00);
            color: #000;
            border: none;
            padding: 13px 35px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 700;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .btn-save:hover:not(:disabled) { opacity: 0.9; transform: scale(1.03); }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ── Status messages ── */
        .status-msg {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
        }
        .status-msg.success {
            background: rgba(0,200,80,0.12);
            border: 2px solid #0c6;
            color: #0d8;
        }
        .status-msg.error {
            background: rgba(255,60,60,0.12);
            border: 2px solid #f44;
            color: #f88;
        }

        .no-results {
            text-align: center;
            color: #666;
            padding: 20px;
            display: none;
        }

        /* ── Loading ── */
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(255,102,0,0.3);
            border-top-color: #ff6600;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            text-align: center; color: #888;
            padding: 20px; border-top: 2px solid #ff6600;
            font-size: 0.85em; margin-top: 20px;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.4em; }
            .back-btn { position: static; margin-bottom: 10px; }
            .items-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="container" id="mainContent" style="display:none;">
        <header>
            <a href="index-secure.html" class="back-btn">← חזרה</a>
            <h1>📋 ספירת מלאי נשקייה</h1>
            <div class="subtitle">הזנת כמויות ציוד פיזי בנשקייה</div>
        </header>

        <div id="lastCountBanner" class="last-count-banner"></div>
        <div id="statusMsg" class="status-msg"></div>

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="🔍 חיפוש פריט..."
            oninput="filterItems()"
        />

        <div id="noResults" class="no-results">לא נמצאו פריטים תואמים</div>
        <div id="itemsGrid" class="items-grid"></div>

        <div class="save-section">
            <div class="save-info">
                שומר שורה חדשה בגיליון הנשקייה עם תאריך, שעה ו<strong id="performerName">...</strong>
            </div>
            <button class="btn-save" id="saveBtn" onclick="saveCount()">💾 שמור ספירה</button>
        </div>

        <footer>
            <p>גדחה"ו קומנדו 8219 | ספירת מלאי נשקייה</p>
            <p style="margin-top:8px;">🔒 כל התקשורת מוצפנת | 📝 כל הפעולות מתועדות</p>
        </footer>
    </div>

    <script src="config.js"></script>
    <script src="auth-client.js"></script>

    <script>
        // ============================================================
        // Item list (same order as backend WEAPONS_ITEM_LIST)
        // ============================================================
        const ITEMS = [
            { key: 'roskM16',         label: 'רוס"ק M16'         },
            { key: 'roskM4',          label: 'רוס"ק M4'          },
            { key: 'negev',           label: 'נגב'                },
            { key: 'mag',             label: 'מאג'                },
            { key: 'matol',           label: 'מטול'               },
            { key: 'baret',           label: 'בארט'               },
            { key: 'trig',            label: 'טריג'               },
            { key: 'm5',              label: 'כוונת M5'           },
            { key: 'pictini',         label: 'פיקטיני'            },
            { key: 'mepro',           label: 'מפרו'               },
            { key: 'zayinNegev',      label: 'ציין נגב'           },
            { key: 'shacha',          label: 'שח"ע'               },
            { key: 'lior',            label: 'ליאור'              },
            { key: 'zavon',           label: 'זאבון'              },
            { key: 'akila6',          label: 'אקילה*6'            },
            { key: 'binoculars',      label: 'משקפת'              },
            { key: 'compass',         label: 'מצפן'               },
            { key: 'armon',           label: 'ערמון'              },
            { key: 'thermalMarker',   label: 'סמן טרמי לחיר'     },
            { key: 'achbar',          label: 'עכבר'               },
            { key: 'lpl',             label: 'LPL'                },
            { key: 'yarour',          label: 'יראור'              },
            { key: 'adi',             label: 'עדי'                },
            { key: 'matolHandasi',    label: 'מט"ל הנדסי'        },
            { key: 'matolSarug',      label: 'מט"ל סרוג'         },
            { key: 'makabim',         label: 'מכבים'              },
            { key: 'shabang',         label: 'שבנג'               },
            { key: 'pagion',          label: 'פגיון'              },
            { key: 'sightPagion',     label: 'כוונת לפגיון'      },
            { key: 'ido',             label: 'עידו'               },
            { key: 'leopold',         label: 'לאופולד'            },
            { key: 'noa',             label: 'נועה'               },
            { key: 'amit',            label: 'עמית'               },
            { key: 'yarin',           label: 'ירין'               },
            { key: 'shabshavet',      label: 'שבשבת'              },
            { key: 'laserMatol',      label: 'סמן לייזר למטול'   },
            { key: 'metzitzan',       label: 'מציצן'              },
            { key: 'rigit',           label: 'ריגיט'              },
            { key: 'magenOz',         label: 'מגן עוז'            },
            { key: 'boresight',       label: 'בורסייט'            },
            { key: 'kundson',         label: 'קונדסון'            },
            { key: 'makhpal',         label: 'מכפל'               },
            { key: 'negavon',         label: 'נגבון'              },
            { key: 'pakZayinNegavon', label: 'פק ציין לנגבון'    },
            { key: 'sightAyotek',     label: 'כוונת איוטק'       },
            { key: 'binocularsPugi',  label: 'משקפת פוגי'        },
            { key: 'ironBall',        label: 'כדור ברזל'          },
            { key: 'mkh',             label: 'מק"ח'               },
            { key: 'kneeNight',       label: 'ברך לילה'           },
            { key: 'kneeDay',         label: 'ברך יום'            },
            { key: 'merkavaCurtain',  label: 'וילון מרכבה'        },
            { key: 'kitBaz',          label: 'ערכת באז'           },
            { key: 'amaSoch',         label: 'אמה סוך'            },
            { key: 'dotSmall',        label: 'נקודה קטנה'         },
            { key: 'dotEnhanced',     label: 'נקודה משופרת'       },
            { key: 'droneIbu',        label: 'רחפן איבו'          },
            { key: 'droneAvatah',     label: 'רחפן אבטה'          },
            { key: 'droneFlycard',    label: 'רחפן פלייקארד'      },
            { key: 'robotRoni',       label: 'רובוט רוני'          },
            { key: 'pinkLady',        label: 'פינק ליידי'          },
            { key: 'robotAlon',       label: 'רובוט אלון'          },
            { key: 'other',           label: 'אחר'                }
        ];

        // ============================================================
        // Init
        // ============================================================
        const authClient = new SecureAuthClient(API_URL);
        const authGuard  = new AuthGuard(authClient);

        window.addEventListener('DOMContentLoaded', async () => {
            const ok = await authGuard.checkAuth();
            if (ok) {
                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display   = 'block';
                const user = authClient.user;
                document.getElementById('performerName').textContent =
                    (user.fullName || user.username || '').replace(/\+/g, ' ');
                renderItems({});
                await loadLatestCount();
            }
        });

        // ============================================================
        // Render items grid
        // ============================================================
        function renderItems(counts) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = ITEMS.map(item => `
                <div class="item-card" id="card_${item.key}">
                    <label class="item-label" for="inp_${item.key}">${escHtml(item.label)}</label>
                    <input
                        type="number"
                        id="inp_${item.key}"
                        class="item-input"
                        min="0"
                        value="${counts[item.key] || 0}"
                        oninput="onInputChange(this)"
                    />
                </div>
            `).join('');
        }

        function onInputChange(el) {
            const v = parseInt(el.value, 10);
            el.classList.toggle('has-value', !isNaN(v) && v > 0);
        }

        // ============================================================
        // Load latest count
        // ============================================================
        async function loadLatestCount() {
            try {
                const postData = new URLSearchParams();
                postData.append('data', JSON.stringify({
                    action: 'get_armory_count',
                    token:  authClient.token
                }));
                const res  = await fetch(API_URL, { method: 'POST', body: postData });
                const json = await res.json();
                if (json.statusCode !== 200) return;

                const { counts, timestamp, performedBy } = json.data;

                // מלא ערכים
                ITEMS.forEach(item => {
                    const inp = document.getElementById('inp_' + item.key);
                    if (inp) {
                        inp.value = counts[item.key] || 0;
                        onInputChange(inp);
                    }
                });

                // banner
                if (timestamp) {
                    const banner = document.getElementById('lastCountBanner');
                    const d = new Date(timestamp).toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem' });
                    banner.innerHTML = `ספירה אחרונה: <span>${d}</span> | בוצע ע"י: <span>${escHtml(performedBy || 'לא ידוע')}</span>`;
                    banner.style.display = 'block';
                }
            } catch (err) {
                console.error('loadLatestCount:', err);
            }
        }

        // ============================================================
        // Save count
        // ============================================================
        async function saveCount() {
            const btn = document.getElementById('saveBtn');
            btn.disabled    = true;
            btn.textContent = '...שומר';
            showStatus('');

            const counts = {};
            ITEMS.forEach(item => {
                const inp = document.getElementById('inp_' + item.key);
                counts[item.key] = inp ? (parseInt(inp.value, 10) || 0) : 0;
            });

            try {
                const postData = new URLSearchParams();
                postData.append('data', JSON.stringify({
                    action: 'save_armory_count',
                    token:  authClient.token,
                    counts: counts
                }));
                const res  = await fetch(API_URL, { method: 'POST', body: postData });
                const json = await res.json();
                if (json.statusCode !== 200) throw new Error(json.message || 'שגיאה בשמירה');

                const ts = json.data && json.data.timestamp
                    ? new Date(json.data.timestamp).toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem' })
                    : '';
                showStatus('✅ ספירה נשמרה בהצלחה' + (ts ? ' — ' + ts : ''), 'success');

                // עדכן banner
                const user = authClient.user;
                const banner = document.getElementById('lastCountBanner');
                banner.innerHTML = `ספירה אחרונה: <span>${ts}</span> | בוצע ע"י: <span>${escHtml((user.fullName || user.username || '').replace(/\+/g, ' '))}</span>`;
                banner.style.display = 'block';

            } catch (err) {
                showStatus('❌ שגיאה: ' + err.message, 'error');
            } finally {
                btn.disabled    = false;
                btn.textContent = '💾 שמור ספירה';
            }
        }

        // ============================================================
        // Search filter
        // ============================================================
        function filterItems() {
            const needle = document.getElementById('searchInput').value.trim().toLowerCase();
            let visible  = 0;
            ITEMS.forEach(item => {
                const card = document.getElementById('card_' + item.key);
                if (!card) return;
                const match = !needle || item.label.toLowerCase().includes(needle) ||
                                         item.key.toLowerCase().includes(needle);
                card.style.display = match ? '' : 'none';
                if (match) visible++;
            });
            document.getElementById('noResults').style.display = visible === 0 ? 'block' : 'none';
        }

        // ============================================================
        // Helpers
        // ============================================================
        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.textContent     = msg;
            el.className       = 'status-msg' + (type ? ' ' + type : '');
            el.style.display   = msg ? 'block' : 'none';
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
    </script>
</body>
</html>
