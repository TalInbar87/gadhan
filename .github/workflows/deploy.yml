name: Deploy to Google Apps Script

# מתי להריץ
on:
  push:
    branches: [ main, master ]
    paths:
      - 'appScripts/**'
  workflow_dispatch: # אפשר להריץ ידנית

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Clone הפרויקט
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      
      # 2. Setup Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      # 3. התקנת clasp
      - name: 📦 Install clasp
        run: npm install -g @google/clasp
      
      # 4. הגדרת credentials
      - name: 🔐 Setup clasp credentials
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          echo "$SCRIPT_ID_PERMISSIONS" > appScripts/.clasp-permissions.json
          echo "$SCRIPT_ID_WEAPONS" > appScripts/.clasp-weapons.json
          echo "$SCRIPT_ID_RADIO" > appScripts/.clasp-radio.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID_PERMISSIONS: ${{ secrets.SCRIPT_ID_PERMISSIONS }}
          SCRIPT_ID_WEAPONS: ${{ secrets.SCRIPT_ID_WEAPONS }}
          SCRIPT_ID_RADIO: ${{ secrets.SCRIPT_ID_RADIO }}
      
      # 5. Deploy Permissions Script
      - name: 🔒 Deploy Permissions Script
        run: |
          cat appScripts/.clasp-permissions.json > appScripts/.clasp.json
          cd appScripts
          cp permissionsAppScript-clean.js Code.gs
          clasp push -f
          clasp deploy --description "Auto deploy $(date)"
        continue-on-error: true
      
      # 6. Deploy Weapons Script
      - name: 🔫 Deploy Weapons Script
        run: |
          cat appScripts/.clasp-weapons.json > appScripts/.clasp.json
          cd appScripts
          cp weaponAppScript-clean.js Code.gs
          clasp push -f
          clasp deploy --description "Auto deploy $(date)"
        continue-on-error: true
      
      # 7. Deploy Radio Script
      - name: 📡 Deploy Radio Script
        run: |
          cat appScripts/.clasp-radio.json > appScripts/.clasp.json
          cd appScripts
          cp radioAppScript-clean.js Code.gs
          clasp push -f
          clasp deploy --description "Auto deploy $(date)"
        continue-on-error: true
      
      # 8. סיכום
      - name: ✅ Deployment Summary
        run: |
          echo "🎉 Deployment completed!"
          echo "📅 Date: $(date)"
          echo "🌿 Branch: ${{ github.ref }}"
          echo "👤 Triggered by: ${{ github.actor }}"
